stages:
  - test
  - train
  - build
  - deploy

variables:
  DOCKER_IMAGE: aiops-inference
  DOCKER_TAG: $CI_COMMIT_SHORT_SHA
  NAMESPACE: aiops

# Test stage
test:
  stage: test
  image: python:3.10-slim
  script:
    - pip install pytest scikit-learn numpy scipy
    - pytest tests/ || echo "No tests found, skipping"
  only:
    - branches

# Train model
train_model:
  stage: train
  image: python:3.10-slim
  script:
    - pip install scikit-learn numpy
    - python model/train.py
  artifacts:
    paths:
      - model/model.pkl
      - model/reference_data.pkl
    expire_in: 1 week
  only:
    - main
    - develop

# Build Docker image
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $DOCKER_IMAGE:$DOCKER_TAG .
    - docker tag $DOCKER_IMAGE:$DOCKER_TAG $DOCKER_IMAGE:latest
    # In real scenario: docker push to registry
  dependencies:
    - train_model
  only:
    - main

# Deploy to Kubernetes
deploy:
  stage: deploy
  image: alpine/helm:latest
  script:
    - helm upgrade --install $DOCKER_IMAGE ./helm 
        -n $NAMESPACE 
        --create-namespace
        --set image.tag=$DOCKER_TAG
        --wait
  only:
    - main
  when: manual

# Scheduled retrain job (runs weekly)
scheduled_retrain:
  stage: train
  image: python:3.10-slim
  script:
    - pip install scikit-learn numpy
    - python model/train.py
    - echo "Model retrained successfully"
    # Trigger deployment pipeline
  artifacts:
    paths:
      - model/model.pkl
      - model/reference_data.pkl
  only:
    - schedules
